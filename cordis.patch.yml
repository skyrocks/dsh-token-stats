# @skyrocks/dsh-token-stats 插件行：作为 bundle patch 自动注入 profile 组合。
# 安装后由 `dsh plugin add` 的 reconcile 步骤登记为 profile layer，无需手改用户层。
# 需要调整时，在 profile 的 cordis.patch.yml 里按 id 覆盖 config：
#   - id: token-stats
#     config:
#       historyDays: 365      # 历史回填只看最近多久创建的会话
#       retainDays: 400       # 账本保留天数（超过的旧记录在落盘时裁掉）
#       dayCount: 14          # 日趋势的柱数
#       weekCount: 12         # 周趋势的柱数
#       monthCount: 12        # 月趋势的柱数
- insert:
    - id: token-stats
      name: "@skyrocks/dsh-token-stats"
